# منطقه زمانی سایت رو ایران تنظیم می‌کنیم تا تاریخ پست‌ها با
# ساعت واقعی ایران چک بشه، نه UTC (که باعث میشد پست‌های امروز
# «آینده» حساب بشن و منتشر نشن).
timezone: Asia/Tehran

# همیشه پست‌ها رو منتشر کن، حتی اگه تاریخشون (به هر دلیلی) از دید
# سرور هنوز نرسیده باشه. برای یک سایت شخصی که زمان‌بندی انتشار
# دقیق لازم نداره، این امن‌ترین و ساده‌ترین راه‌حله.
future: true

