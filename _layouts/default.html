<!DOCTYPE html>
<html lang="fa" dir="rtl">
{% include head.html %}
<body class="{% if page.url == '/podcast/' %}page-podcast{% endif %}">
  <script>window.NOYS_BASEURL = "{{ site.baseurl }}";</script>

  <nav class="noys-floatnav" id="noysFloatNav">
    <div class="noys-floatnav-inner">
      <button type="button" class="noys-nav-search-btn" id="noysSearchToggle" aria-label="جستجو">
        <i class="fa fa-search" aria-hidden="true"></i>
      </button>
      <div class="noys-nav-links">
        <a href="{{ site.baseurl }}/" class="{% if page.layout == 'main' and page.title == nil %}is-active{% endif %}">مجله</a>
        <a href="{{ site.baseurl }}/podcast/" class="{% if page.url == '/podcast/' %}is-active{% endif %}">پادکست</a>
      </div>
      <button type="button" class="noys-theme-toggle" aria-label="تغییر حالت روشن/تاریک">
        <i class="fa fa-sun-o noys-icon-light" aria-hidden="true"></i>
        <i class="fa fa-moon-o noys-icon-dark" aria-hidden="true"></i>
      </button>
      <button type="button" class="noys-reader-btn" id="noysFontMinus" aria-label="کوچک‌تر کردن فونت">A-</button>
      <button type="button" class="noys-reader-btn" id="noysFontPlus" aria-label="بزرگ‌تر کردن فونت">A+</button>
      <button type="button" class="noys-reader-btn noys-read-mode-btn" id="noysReadMode" aria-label="حالت ریدینگ">
        <i class="fa fa-book" aria-hidden="true"></i>
      </button>
    </div>
    <div class="noys-search-panel" id="noysSearchPanel" hidden>
      <div class="noys-search-input-wrap">
        <i class="fa fa-search" aria-hidden="true"></i>
        <input
          type="text"
          id="noysSearchInput"
          placeholder="جستجو در مجله و پادکست..."
          autocomplete="off"
        >
      </div>
      <div class="noys-search-results" id="noysSearchResults"></div>
    </div>
  </nav>

  <!-- پخش‌کننده‌ی شناور — عمداً بیرون از wrapper، تا موقع تعویض صفحه دست‌نخورده بمونه -->
  <div class="noys-floating-player" id="noysFloatingPlayer" hidden>
    <div class="noys-floating-player-bar">
      <img id="noysFPCover" class="noys-floating-player-cover" src="" alt="">
      <span id="noysFPTitle" class="noys-floating-player-title"></span>
      <button type="button" id="noysFPMinimize" class="noys-floating-player-btn" aria-label="کوچک/بزرگ کردن">–</button>
      <button type="button" id="noysFPClose" class="noys-floating-player-btn" aria-label="بستن پخش‌کننده">✕</button>
    </div>
    <div class="noys-floating-player-frame-wrap" id="noysFPFrameWrap">
      <div class="noys-floating-player-frame" id="noysFPFrame"></div>
      <svg class="noys-fp-scrollbar" id="noysFPScrollbar" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="noysFPScrollbarGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#fff200"/>
            <stop offset="100%" stop-color="#3d1e8c"/>
          </linearGradient>
        </defs>
        <line class="noys-fp-scrollbar-track" id="noysFPScrollbarTrack"></line>
        <line class="noys-fp-scrollbar-thumb" id="noysFPScrollbarThumb"></line>
      </svg>
    </div>
  </div>

  <div class="wrapper" id="noysWrapper">
    {{ content }}
  </div>

  {% include analytics.html %}
  {% include javascripts.html %}

  <style>
    /* ===== پخش‌کننده‌ی شناور پادکست ===== */
    .noys-floating-player {
      position: fixed;
      bottom: 14px;
      inset-inline-end: 14px;
      width: min(560px, calc(100vw - 28px));
      background: #fff;
      border: 1px solid #eee;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(255, 242, 0, 0.35);
      z-index: 9999;
      overflow: hidden;
    }
    .noys-floating-player.is-dragging {
      transition: none;
      box-shadow: 0 22px 55px rgba(255, 242, 0, 0.5);
    }
    .noys-floating-player-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      direction: rtl;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .noys-floating-player.is-dragging .noys-floating-player-bar {
      cursor: grabbing;
    }
    .noys-floating-player.is-dragging .noys-floating-player-frame iframe {
      pointer-events: none;
    }
    .noys-floating-player-cover {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
      flex: 0 0 auto;
    }
    .noys-floating-player-title {
      flex: 1 1 auto;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .noys-floating-player-btn {
      border: none;
      background: #f2f2f2;
      border-radius: 6px;
      width: 26px;
      height: 26px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      flex: 0 0 auto;
    }
    .noys-floating-player-btn:hover {
      background: #fff200;
    }
    .noys-floating-player-frame-wrap {
      position: relative;
    }
    .noys-floating-player.is-minimized .noys-floating-player-frame-wrap {
      display: none;
    }
    .noys-floating-player-frame {
      width: 100%;
      max-height: min(420px, calc(100vh - 120px));
      overflow-y: auto;

      /* اسکرول‌بار بومی مرورگر رو مخفی می‌کنیم چون یک نسخه‌ی سفارشی
         (منحنی و هم‌رنگ لوگو) به‌جاش رسم می‌کنیم */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .noys-floating-player-frame::-webkit-scrollbar {
      display: none;
    }
    .noys-floating-player-frame iframe {
      display: block;
      width: 100%;
      border: 0;
      height: 380px;
    }

    /* ===== اسکرول‌بار سفارشی منحنی — رنگ لوگو + بنفشِ هارمونیک ===== */
    .noys-fp-scrollbar {
      position: absolute;
      top: 0;
      left: 5px;
      width: 12px;
      height: 100%;

      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .noys-fp-scrollbar.is-active {
      opacity: 1;
    }
    .noys-fp-scrollbar-track {
      stroke: rgba(255, 242, 0, 0.18);
      stroke-width: 5;
      stroke-linecap: round;
    }
    .noys-fp-scrollbar-thumb {
      stroke: url(#noysFPScrollbarGradient);
      stroke-width: 5;
      stroke-linecap: round;
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
    }
    .noys-fp-scrollbar-thumb:active {
      cursor: grabbing;
    }
    html[data-theme="dark"] .noys-fp-scrollbar-track {
      stroke: rgba(255, 242, 0, 0.12);
    }
    @media (max-width: 768px) {
      .noys-floating-player {
        inset-inline-end: 8px;
        width: calc(100vw - 16px);
      }
    }
    @media (max-width: 480px) {
      .noys-floating-player {
        inset-inline-end: 6px;
        bottom: 8px;
        width: calc(100vw - 12px);
      }
      .noys-floating-player-frame iframe {
        height: 320px;
      }
    }
  </style>

  <script>
  (function () {
    // ---------- کنترل‌کننده‌ی سراسری پخش‌کننده‌ی پادکست ----------
    var fp        = document.getElementById('noysFloatingPlayer');
    var fpFrame   = document.getElementById('noysFPFrame');
    var fpTitle   = document.getElementById('noysFPTitle');
    var fpCover   = document.getElementById('noysFPCover');
    var fpMin     = document.getElementById('noysFPMinimize');
    var fpClose   = document.getElementById('noysFPClose');
    var fpScrollbar = document.getElementById('noysFPScrollbar');
    var fpTrack     = document.getElementById('noysFPScrollbarTrack');
    var fpThumb     = document.getElementById('noysFPScrollbarThumb');

    // ---------- اسکرول‌بار سفارشی منحنی (زرد لوگو → بنفش هارمونیک) ----------
    var fpPad = 6; // فاصله‌ی دو سرِ خط از لبه، هم‌اندازه‌ی نصفِ stroke-width که گرد می‌شه
    var fpThumbState = { start: fpPad, trackLen: 0, thumbLen: 0 };

    function noysUpdateFPScrollbar() {
      var H = fpFrame.clientHeight;
      var S = fpFrame.scrollHeight;
      var T = fpFrame.scrollTop;

      if (!H || S <= H + 1) {
        fpScrollbar.classList.remove('is-active');
        return;
      }

      fpScrollbar.classList.add('is-active');
      fpScrollbar.setAttribute('width', 12);
      fpScrollbar.setAttribute('height', H);

      fpTrack.setAttribute('x1', 6);
      fpTrack.setAttribute('y1', fpPad);
      fpTrack.setAttribute('x2', 6);
      fpTrack.setAttribute('y2', H - fpPad);

      var trackLen = Math.max(0, H - fpPad * 2);
      var ratio = H / S;
      var thumbLen = Math.max(24, ratio * trackLen);
      var maxTravel = Math.max(0, trackLen - thumbLen);
      var scrollableDist = S - H;
      var thumbOffset = scrollableDist > 0 ? (T / scrollableDist) * maxTravel : 0;
      var thumbStart = fpPad + thumbOffset;
      var thumbEnd = thumbStart + thumbLen;

      fpThumb.setAttribute('x1', 6);
      fpThumb.setAttribute('y1', thumbStart);
      fpThumb.setAttribute('x2', 6);
      fpThumb.setAttribute('y2', thumbEnd);

      fpThumbState.start = thumbStart;
      fpThumbState.trackLen = trackLen;
      fpThumbState.thumbLen = thumbLen;
    }

    fpFrame.addEventListener('scroll', noysUpdateFPScrollbar, { passive: true });
    window.addEventListener('resize', noysUpdateFPScrollbar);

    if ('ResizeObserver' in window) {
      new ResizeObserver(noysUpdateFPScrollbar).observe(fpFrame);
    }

    var fpThumbDragging = false;
    var fpThumbDragStartY = 0;
    var fpThumbDragStartOffset = 0;

    fpThumb.addEventListener('pointerdown', function (e) {
      fpThumbDragging = true;
      fpThumbDragStartY = e.clientY;
      fpThumbDragStartOffset = fpThumbState.start - fpPad;
      fpThumb.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    fpThumb.addEventListener('pointermove', function (e) {
      if (!fpThumbDragging) return;
      var maxTravel = Math.max(0, fpThumbState.trackLen - fpThumbState.thumbLen);
      if (maxTravel <= 0) return;

      var deltaY = e.clientY - fpThumbDragStartY;
      var newOffset = Math.min(maxTravel, Math.max(0, fpThumbDragStartOffset + deltaY));
      var fraction = newOffset / maxTravel;

      fpFrame.scrollTop = fraction * (fpFrame.scrollHeight - fpFrame.clientHeight);
    });

    function fpThumbEndDrag(e) {
      if (!fpThumbDragging) return;
      fpThumbDragging = false;
      try { fpThumb.releasePointerCapture(e.pointerId); } catch (err) {}
    }

    fpThumb.addEventListener('pointerup', fpThumbEndDrag);
    fpThumb.addEventListener('pointercancel', fpThumbEndDrag);

    window.NOYS_PLAY_PODCAST = function (opts) {
      opts = opts || {};
      fpTitle.textContent = opts.title || '';
      fpCover.src = opts.cover || '';

      var src = (opts.episodeId && opts.episodeId !== '')
        ? 'https://castbox.fm/app/castbox/player/id' + opts.channelId + '/id' + opts.episodeId + '?v=8.22.11&autoplay=1&hide_list=1'
        : 'https://castbox.fm/app/castbox/player/id' + opts.channelId + '?v=8.22.11&autoplay=1';

      fpFrame.innerHTML =
        '<iframe src="' + src + '" frameborder="0" width="100%" height="380" ' +
        'allow="autoplay" loading="lazy" title="' + (opts.title || '').replace(/"/g, '&quot;') + '"></iframe>';

      fp.hidden = false;
      fp.classList.remove('is-minimized');

      requestAnimationFrame(noysUpdateFPScrollbar);
    };

    fpMin.addEventListener('click', function () {
      fp.classList.toggle('is-minimized');
      fpMin.textContent = fp.classList.contains('is-minimized') ? '+' : '–';
      if (!fp.classList.contains('is-minimized')) {
        requestAnimationFrame(noysUpdateFPScrollbar);
      }
    });

    fpClose.addEventListener('click', function () {
      fpFrame.innerHTML = '';
      fp.hidden = true;
    });

    // ---------- قابلیت جابه‌جا کردن (درگ) پخش‌کننده‌ی شناور ----------
    var fpBar = fp.querySelector('.noys-floating-player-bar');
    var dragging = false;
    var dragOffsetX = 0;
    var dragOffsetY = 0;

    function fpClamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function fpClampToViewport() {
      // اگه قبلاً جابه‌جا شده (یعنی left/top داره)، مطمئن شو با تغییر
      // اندازه‌ی صفحه یا باز/بسته شدن پلیر، بیرون از دید نره.
      if (fp.style.left === '') return;
      var rect = fp.getBoundingClientRect();
      var maxX = window.innerWidth - rect.width - 4;
      var maxY = window.innerHeight - rect.height - 4;
      fp.style.left = fpClamp(rect.left, 4, Math.max(4, maxX)) + 'px';
      fp.style.top = fpClamp(rect.top, 4, Math.max(4, maxY)) + 'px';
    }

    fpBar.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.noys-floating-player-btn')) return;

      dragging = true;
      fp.classList.add('is-dragging');

      var rect = fp.getBoundingClientRect();
      dragOffsetX = e.clientX - rect.left;
      dragOffsetY = e.clientY - rect.top;

      // از حالت چسبیده به گوشه (bottom/inset-inline-end) درش می‌آریم
      // و با left/top آزادانه قابل جابه‌جایی می‌کنیم.
      fp.style.left = rect.left + 'px';
      fp.style.top = rect.top + 'px';
      fp.style.right = 'auto';
      fp.style.bottom = 'auto';
      fp.style.insetInlineEnd = 'auto';

      fpBar.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    fpBar.addEventListener('pointermove', function (e) {
      if (!dragging) return;

      var rect = fp.getBoundingClientRect();
      var maxX = window.innerWidth - rect.width - 4;
      var maxY = window.innerHeight - rect.height - 4;

      var x = fpClamp(e.clientX - dragOffsetX, 4, Math.max(4, maxX));
      var y = fpClamp(e.clientY - dragOffsetY, 4, Math.max(4, maxY));

      fp.style.left = x + 'px';
      fp.style.top = y + 'px';
    });

    function fpEndDrag(e) {
      if (!dragging) return;
      dragging = false;
      fp.classList.remove('is-dragging');
      try { fpBar.releasePointerCapture(e.pointerId); } catch (err) {}
    }

    fpBar.addEventListener('pointerup', fpEndDrag);
    fpBar.addEventListener('pointercancel', fpEndDrag);

    window.addEventListener('resize', fpClampToViewport);

    // ---------- افکت ظاهر شدن هنگام اسکرول + پارالاکس عکس کاور ----------
    var noysReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var noysParallaxEls = [];

    var noysRevealObserver = ('IntersectionObserver' in window) ? new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          noysRevealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }) : null;

    function noysInitReveal(container) {
      if (noysReducedMotion) return;
      var root = container || document;
      var selector = [
        '.posts-list > .post',
        '.posts-list > .noys-decor',
        '.podcast-grid > .podcast-card',
        '.post-markdown-body > h2',
        '.post-markdown-body > h3',
        '.post-markdown-body > p',
        '.post-markdown-body > img',
        '.post-markdown-body > blockquote',
        '.post-markdown-body > div.video-container',
        '.category-section .tag-list',
        '.disclaimer-section'
      ].join(', ');

      root.querySelectorAll(selector).forEach(function (el) {
        if (el.classList.contains('noys-reveal-bound')) return;
        el.classList.add('noys-reveal', 'noys-reveal-bound');
        if (noysRevealObserver) {
          noysRevealObserver.observe(el);
        } else {
          el.classList.add('is-visible');
        }
      });
    }

    function noysRefreshParallaxEls(container) {
      var root = container || document;
      noysParallaxEls = Array.prototype.slice.call(root.querySelectorAll('[data-noys-parallax]'));
    }

    function noysOnScrollParallax() {
      if (noysReducedMotion || !noysParallaxEls.length) return;
      noysParallaxEls.forEach(function (img) {
        var rect = img.getBoundingClientRect();
        var offset = rect.top * 0.15;
        img.style.transform = 'translateY(' + offset.toFixed(1) + 'px) scale(1.08)';
      });
    }

    var noysParallaxTicking = false;
    window.addEventListener('scroll', function () {
      if (noysParallaxTicking) return;
      noysParallaxTicking = true;
      requestAnimationFrame(function () {
        noysOnScrollParallax();
        noysParallaxTicking = false;
      });
    }, { passive: true });

    noysInitReveal();
    noysRefreshParallaxEls();
    noysOnScrollParallax();

    // ---------- pjax ساده: فقط #noysWrapper عوض می‌شه ----------
    var wrapper = document.getElementById('noysWrapper');

    function noysRunPageScripts(container) {
      // اسکریپت‌هایی که داخل محتوای جدید (با innerHTML) اومدن، خودشون اجرا نمی‌شن؛
      // اینجا هرکدوم رو دستی می‌سازیم و اجرا می‌کنیم.
      container.querySelectorAll('script').forEach(function (oldScript) {
        var s = document.createElement('script');
        if (oldScript.src) {
          s.src = oldScript.src;
        } else {
          s.textContent = oldScript.textContent;
        }
        oldScript.replaceWith(s);
      });
    }

    function noysSetActiveNav(url) {
      document.querySelectorAll('.noys-nav-links a').forEach(function (a) {
        var isPodcast = url.indexOf('/podcast/') !== -1;
        var isHome = url === (window.NOYS_BASEURL + '/') || url === window.NOYS_BASEURL;
        if (a.getAttribute('href').indexOf('/podcast/') !== -1) {
          a.classList.toggle('is-active', isPodcast);
        } else {
          a.classList.toggle('is-active', isHome && !isPodcast);
        }
      });
    }

    function noysLoadPage(url, push) {
      fetch(url, { credentials: 'same-origin' })
        .then(function (res) { return res.text(); })
        .then(function (html) {
          var doc = new DOMParser().parseFromString(html, 'text/html');
          var newWrapper = doc.getElementById('noysWrapper');
          if (!newWrapper) {
            // اگه صفحه‌ی مقصد ساختار wrapper نداشت، برای اطمینان رفرش کامل بزن
            window.location.href = url;
            return;
          }
          wrapper.innerHTML = newWrapper.innerHTML;
          document.title = doc.title;
          noysRunPageScripts(wrapper);
          noysSetActiveNav(url);
          window.scrollTo(0, 0);
          noysInitReveal(wrapper);
          noysRefreshParallaxEls(wrapper);
          noysOnScrollParallax();
          if (window.NOYS_BIND_READER_CONTROLS) { window.NOYS_BIND_READER_CONTROLS(); }
          if (push) {
            history.pushState({ noysUrl: url }, '', url);
          }
        })
        .catch(function () {
          window.location.href = url; // در صورت خطا، رفتار عادی مرورگر
        });
    }

    document.addEventListener('click', function (e) {
      var a = e.target.closest('a');
      if (!a) return;
      if (a.target === '_blank' || a.hasAttribute('download')) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;

      var href = a.getAttribute('href');
      if (!href || href.charAt(0) === '#') return;

      var url = new URL(href, window.location.href);
      if (url.origin !== window.location.origin) return; // لینک خارجی
      if (/\.(pdf|zip|jpg|jpeg|png|gif|svg|mp3|mp4)$/i.test(url.pathname)) return;

      e.preventDefault();
      if (url.href !== window.location.href) {
        noysLoadPage(url.href, true);
      }
    });

    window.addEventListener('popstate', function () {
      noysLoadPage(window.location.href, false);
    });
  })();
  </script>

  <script>
  // ---------- کنترل اندازه فونت + حالت ریدینگ‌مود ----------
  (function () {
    var root = document.documentElement;
    var scale = parseFloat(localStorage.getItem('noysFontScale') || '1');
    root.style.setProperty('--noys-scale', scale);

    function bindControls() {
      var minus = document.getElementById('noysFontMinus');
      var plus  = document.getElementById('noysFontPlus');
      var read  = document.getElementById('noysReadMode');

      function setScale(v) {
        scale = Math.min(1.6, Math.max(0.8, v));
        root.style.setProperty('--noys-scale', scale);
        localStorage.setItem('noysFontScale', scale);
      }

      if (minus && !minus.dataset.bound) {
        minus.dataset.bound = '1';
        minus.addEventListener('click', function () { setScale(scale - 0.1); });
      }
      if (plus && !plus.dataset.bound) {
        plus.dataset.bound = '1';
        plus.addEventListener('click', function () { setScale(scale + 0.1); });
      }
      if (read && !read.dataset.bound) {
        read.dataset.bound = '1';
        if (localStorage.getItem('noysReadingMode') === '1') {
          document.body.classList.add('noys-reading-mode');
          read.classList.add('is-active');
        }
        read.addEventListener('click', function () {
          var isOn = document.body.classList.toggle('noys-reading-mode');
          read.classList.toggle('is-active', isOn);
          localStorage.setItem('noysReadingMode', isOn ? '1' : '0');
        });
      }
    }

    // چون سایت لینک‌های داخلی رو با fetch/AJAX لود می‌کنه (بدون رفرش کامل صفحه)،
    // بعد از هر بار جایگزینی محتوا باید دوباره دکمه‌ها رو پیدا و فعال کنیم.
    // این تابع رو گلوبال می‌کنیم تا noysLoadPage هم بتونه صداش کنه.
    window.NOYS_BIND_READER_CONTROLS = bindControls;
    bindControls();
    window.addEventListener('popstate', function () {
      setTimeout(bindControls, 50);
    });
  })();
  </script>
</body>
</html>
